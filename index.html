<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ Paint Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <span class="logo-icon">🎨</span>
            <h1>Paint <span class="accent">Studio</span></h1>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="undoBtn" title="Отменить (Ctrl+Z)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button class="btn-icon" id="redoBtn" title="Повторить (Ctrl+Y)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <div class="separator"></div>
            <button class="btn-icon" id="clearBtn" title="Очистить холст">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button class="btn-icon" id="insertImageBtn" title="Вставить картинку (Ctrl+O)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
            <button class="btn-primary" id="saveBtn" title="Сохранить изображение">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                <span>Сохранить</span>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="app-main">
        <!-- Tools Sidebar -->
        <aside class="tools-panel">
            <div class="panel-section">
                <h3 class="panel-title">Инструменты</h3>
                <div class="tools-grid">
                    <button class="tool-btn active" data-tool="brush" title="Кисть (B)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="eraser" title="Ластик (E)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 20"/><path d="M6 11l7 7"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="line" title="Линия (L)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="rect" title="Прямоугольник (R)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="circle" title="Круг (C)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="triangle" title="Треугольник (T)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3L22 21H2L12 3z"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="fill" title="Заливка (F)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11L7.5 23.5a1.5 1.5 0 0 1-2.5-1L2 17l8.5-8.5"/><path d="M2 17l10-10 7 7L9 24"/><path d="M16 8l5.5 5.5a1.5 1.5 0 0 1 0 2.1L20 17"/><path d="M5 2l1.5 1.5"/><circle cx="20" cy="21" r="1.5" fill="currentColor"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="picker" title="Пипетка (I)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22v-2l1-1 1 1-2 2z"/><path d="M4 20l9-9"/><path d="M13 11l-2-2 5-5 2 2-5 5z"/><path d="M18 3l3 3-2 2-3-3 2-2z"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="spray" title="Спрей (S)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="5"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="6" r="1" fill="currentColor"/><circle cx="16" cy="8" r="1" fill="currentColor"/><circle cx="6" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="12" r="1" fill="currentColor"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="text" title="Текст (X)">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                    </button>
                </div>
            </div>

            <!-- Brush Size -->
            <div class="panel-section">
                <h3 class="panel-title">Размер</h3>
                <div class="size-control">
                    <input type="range" id="sizeSlider" min="1" max="80" value="5" class="slider">
                    <div class="size-preview-wrap">
                        <div class="size-preview" id="sizePreview"></div>
                        <span class="size-value" id="sizeValue">5px</span>
                    </div>
                </div>
            </div>

            <!-- Opacity -->
            <div class="panel-section">
                <h3 class="panel-title">Прозрачность</h3>
                <div class="size-control">
                    <input type="range" id="opacitySlider" min="1" max="100" value="100" class="slider opacity-slider">
                    <span class="size-value" id="opacityValue">100%</span>
                </div>
            </div>

            <!-- Shapes fill toggle -->
            <div class="panel-section" id="fillToggleSection" style="display:none;">
                <label class="toggle-label">
                    <span>Заливать фигуру</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="shapeFillToggle">
                        <span class="toggle-slider"></span>
                    </div>
                </label>
            </div>
        </aside>

        <!-- Canvas Area -->
        <section class="canvas-area">
            <div class="canvas-viewport" id="canvasViewport">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="mainCanvas"></canvas>
                    <canvas id="overlayCanvas"></canvas>
                </div>
            </div>
            <div class="canvas-status">
                <span id="coordsDisplay">X: 0, Y: 0</span>
                <span id="canvasSizeDisplay">1200 × 700</span>
                <span class="zoom-badge" id="zoomBadge" title="Ctrl + колесо — зум · Зажать колесо — двигать холст · Клик — сбросить (Ctrl+0)">100%</span>
                <span id="toolDisplay">Кисть</span>
            </div>
        </section>

        <!-- Color Panel -->
        <aside class="color-panel">
            <div class="panel-section">
                <h3 class="panel-title">Текущий цвет</h3>
                <div class="current-colors">
                    <div class="color-swatch primary" id="primaryColor" title="Основной цвет"></div>
                    <div class="color-swatch secondary" id="secondaryColor" title="Дополнительный цвет"></div>
                </div>
                <div class="swap-colors-btn" id="swapColors" title="Поменять цвета (Shift+X)">⇄</div>
            </div>

            <div class="panel-section">
                <h3 class="panel-title">Палитра</h3>
                <div class="color-palette" id="colorPalette"></div>
            </div>

            <div class="panel-section">
                <h3 class="panel-title">Свой цвет</h3>
                <div class="custom-color">
                    <input type="color" id="colorPicker" value="#000000">
                    <input type="text" id="hexInput" class="hex-input" value="#000000" maxlength="7" placeholder="#000000">
                </div>
            </div>

            <div class="panel-section">
                <h3 class="panel-title">Недавние</h3>
                <div class="recent-colors" id="recentColors"></div>
            </div>

            <!-- Background color -->
            <div class="panel-section">
                <h3 class="panel-title">Фон холста</h3>
                <div class="bg-options">
                    <button class="bg-btn active" data-bg="#ffffff" style="background:#ffffff;" title="Белый"></button>
                    <button class="bg-btn" data-bg="#1a1a2e" style="background:#1a1a2e;" title="Тёмный"></button>
                    <button class="bg-btn" data-bg="#f5f0e8" style="background:#f5f0e8;" title="Кремовый"></button>
                    <button class="bg-btn" data-bg="#e8f4f8" style="background:#e8f4f8;" title="Голубой"></button>
                    <button class="bg-btn" data-bg="#fef0f0" style="background:#fef0f0;" title="Розовый"></button>
                    <button class="bg-btn" data-bg="#f0fff0" style="background:#f0fff0;" title="Зелёный"></button>
                </div>
            </div>
        </aside>
    </main>

    <!-- Text Input Modal -->
    <div class="modal-overlay" id="textModal">
        <div class="modal">
            <h3>Введите текст</h3>
            <input type="text" id="textInput" class="text-input" placeholder="Ваш текст..." autofocus>
            <div class="modal-actions">
                <button class="btn-secondary" id="textCancel">Отмена</button>
                <button class="btn-primary" id="textConfirm">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
